<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vardaan sample concepts</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { --bg: #f4f5f3; --ink: #111315; --muted: #5f646a; --line: #d9dbd6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111315; --ink: #f1f2ef; --muted: #a3a8ad; --line: #2a2e32; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: clamp(28px, 6vw, 40px); letter-spacing: -0.02em; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 32px; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    a { display: flex; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
    a:hover span:first-child { text-decoration: underline; }
    span:last-child { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Vardaan Healthcare &amp; Diagnostics</h1>
    <p>Sample homepage concepts for the clinic's review. Not an official website.</p>
    <ul>
      <li><a href="sample-1/"><span>Sample 1</span><span>Calm teal, light and dark</span></a></li>
      <li><a href="sample-2/"><span>Sample 2</span><span>Dark, 3D helix and sample vial</span></a></li>
      <li><a href="sample-3/"><span>Sample 3</span><span>Light editorial, scroll animation</span></a></li>
    </ul>
  </main>
</body>
</html>
